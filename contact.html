<head>
    <meta charset="UTF-8">

    <meta property="og:title" content="Contact — Mostofa">

    <meta property="og:image" content="images/img.jpg">
    <link rel="icon" type="image/png" href="images/faveicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300..800&family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <h3><span>m</span>ostofa.</h3>
        </div>
        <div class="menu-toggle" id="menu-toggle" role="button" tabindex="0" aria-label="Open menu" aria-expanded="false">
            <i class="fa-solid fa-bars"></i>
        </div>

        <ul class="header-list">
            <li><a href="index.html" class="fade-link" data-link>Home</a></li>
            <li><a href="about.html" class="fade-link" data-link>About</a></li>
            <li><a href="project.html" class="fade-link" data-link>Projects</a></li>
            <li><a href="contact.html" class="fade-link" data-link>Contact</a></li>
        </ul>
        <ul class="header-list-icon">
            <li><a href="https://instagram.com/cz.mostofa" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a></li>
            <li><a href="https://github.com/masatoshinn" aria-label="GitHub"><i class="fa-brands fa-github"></i></a></li>
            <li><a href="https://fb.com/cz.mostofax" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a></li>
        </ul>
    </header>
    <div class="slide-menu" id="slide-menu">
        <button class="menu-close" id="menu-close" aria-label="Close menu"><i class="fa-solid fa-xmark"></i></button>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="project.html">Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </div>
    <div class="menu-overlay" id="menu-overlay"></div>

    <section class="contact">
        <h3>Get in Touch <i class="fa-regular fa-message"></i></h3>
        <div class="container">
            <div class="contact-content">
                <div class="contact-info">
                    <div class="contact-item">
                        <i class="fas fa-envelope"></i>
                        <p>czmostofa@proton.me</p>
                    </div>
                    <div class="contact-item">
                        <i class="fas fa-phone"></i>
                        <p>+880 19762-28102</p>
                    </div>
                    <div class="contact-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <p>Bangladesh, Dhaka</p>
                    </div>
                    <div class="contact-item">
                        <i class="fas fa-clock"></i>
                        <p>Available: Mon-Fri, 9AM-6PM</p>
                    </div>
                    <div class="social-links-contact">
                        <a href="https://fb.com/cz.mostofax" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                        <a href="https://github.com/masatoshinn" aria-label="GitHub"><i class="fab fa-github"></i></a>
                        <a href="https://twitter.com/czmostofa" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                        <a href="https://instagram.com/cz.mostofa" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                        <a href="https://wa.me/8801976228102" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
                    </div>
                </div>
                <form class="contact-form">
                    <div class="form-group">
                        <input type="text" name="name" placeholder="Your Name" aria-label="Your name" required>
                    </div>
                    <div class="form-group">
                        <input type="email" name="email" placeholder="Your Email" aria-label="Your email" required>
                    </div>
                    <div class="form-group">
                        <input type="text" name="subject" placeholder="Subject" aria-label="Subject" required>
                    </div>
                    <div class="form-group">
                        <textarea name="message" placeholder="Your Message" rows="6" aria-label="Your message" required></textarea>
                    </div>
                    <button type="submit" class="btn">Send Message</button>
                </form>
            </div>
        </div>
    </section>
    <script src="main.js"></script>
</body>
</html>
